services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
